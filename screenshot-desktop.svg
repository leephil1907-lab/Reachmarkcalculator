<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="deskGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141c22"/>
      <stop offset="70%" stop-color="#0a0d10"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2fa7a"/>
      <stop offset="100%" stop-color="#c4e350"/>
    </linearGradient>
    <filter id="shadow3d" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#deskGlow)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131920" stroke-width="1"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.4"/>

  <!-- Left Side: Main Calculator Window -->
  <g transform="translate(140, 40)" filter="url(#shadow3d)">
    <!-- Container Chassis -->
    <rect width="520" height="640" rx="28" fill="#0f1418" stroke="#1d262e" stroke-width="2"/>

    <!-- App Top Bar -->
    <rect x="0" y="0" width="520" height="64" rx="28" fill="#131a20"/>
    <rect x="0" y="32" width="520" height="32" fill="#131a20"/>
    <line x1="0" y1="64" x2="520" y2="64" stroke="#1d262e" stroke-width="1.5"/>

    <!-- Brand -->
    <g transform="translate(24, 18)">
      <rect width="28" height="28" rx="8" fill="#d6f269"/>
      <text x="38" y="20" fill="#f0f4f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" letter-spacing="1">REACHMARK</text>
      <circle cx="166" cy="18" r="4" fill="#d6f269"/>
    </g>

    <!-- Header Actions -->
    <rect x="360" y="16" width="60" height="32" rx="8" fill="#1b232a" stroke="#2a3642" stroke-width="1"/>
    <text x="390" y="37" fill="#d6f269" font-family="sans-serif" font-weight="700" font-size="13" text-anchor="middle">fx</text>
    
    <rect x="432" y="16" width="64" height="32" rx="8" fill="#1b232a" stroke="#2a3642" stroke-width="1"/>
    <text x="464" y="37" fill="#a0b0c0" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">Menu</text>

    <!-- Calculator Display Screen -->
    <g transform="translate(24, 84)">
      <rect width="472" height="116" rx="16" fill="#07090b" stroke="#19222a" stroke-width="1.5"/>
      <!-- Angle / Mode Badges -->
      <rect x="14" y="12" width="42" height="20" rx="6" fill="#141c22" stroke="#22303c" stroke-width="1"/>
      <text x="35" y="26" fill="#d6f269" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">DEG</text>
      <text x="68" y="26" fill="#627382" font-family="monospace" font-size="11" font-weight="700">3D ON</text>

      <!-- Expression History Line -->
      <text x="454" y="44" fill="#718292" font-family="monospace" font-size="16" text-anchor="end">2,450 × 1.15 + (820 ÷ 4)</text>

      <!-- Main Result Display Line -->
      <text x="454" y="94" fill="#d6f269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="40" font-weight="700" text-anchor="end">= 3,022.5</text>
    </g>

    <!-- Keypad Grid (3D Keycaps) -->
    <!-- Row 1: AC, +/-, %, / -->
    <g transform="translate(24, 220)">
      <!-- Key 1 -->
      <rect x="0" y="0" width="106" height="52" rx="12" fill="#1f2832" stroke="#2f3d4c" stroke-width="1"/>
      <rect x="0" y="0" width="106" height="47" rx="12" fill="#26313d"/>
      <text x="53" y="30" fill="#f87171" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">AC</text>

      <!-- Key 2 -->
      <rect x="122" y="0" width="106" height="52" rx="12" fill="#1f2832" stroke="#2f3d4c" stroke-width="1"/>
      <rect x="122" y="0" width="106" height="47" rx="12" fill="#26313d"/>
      <text x="175" y="30" fill="#a0b0c0" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">±</text>

      <!-- Key 3 -->
      <rect x="244" y="0" width="106" height="52" rx="12" fill="#1f2832" stroke="#2f3d4c" stroke-width="1"/>
      <rect x="244" y="0" width="106" height="47" rx="12" fill="#26313d"/>
      <text x="297" y="30" fill="#a0b0c0" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">%</text>

      <!-- Key 4 (Divide) -->
      <rect x="366" y="0" width="106" height="52" rx="12" fill="#2a3540" stroke="#3d4d5e" stroke-width="1"/>
      <rect x="366" y="0" width="106" height="47" rx="12" fill="#323f4d"/>
      <text x="419" y="30" fill="#d6f269" font-family="sans-serif" font-weight="700" font-size="22" text-anchor="middle">÷</text>
    </g>

    <!-- Row 2: 7, 8, 9, x -->
    <g transform="translate(24, 288)">
      <rect x="0" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="0" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="53" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">7</text>

      <rect x="122" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="122" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="175" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">8</text>

      <rect x="244" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="244" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="297" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">9</text>

      <rect x="366" y="0" width="106" height="52" rx="12" fill="#2a3540" stroke="#3d4d5e" stroke-width="1"/>
      <rect x="366" y="0" width="106" height="47" rx="12" fill="#323f4d"/>
      <text x="419" y="30" fill="#d6f269" font-family="sans-serif" font-weight="700" font-size="22" text-anchor="middle">×</text>
    </g>

    <!-- Row 3: 4, 5, 6, - -->
    <g transform="translate(24, 356)">
      <rect x="0" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="0" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="53" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">4</text>

      <rect x="122" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="122" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="175" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">5</text>

      <rect x="244" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="244" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="297" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">6</text>

      <rect x="366" y="0" width="106" height="52" rx="12" fill="#2a3540" stroke="#3d4d5e" stroke-width="1"/>
      <rect x="366" y="0" width="106" height="47" rx="12" fill="#323f4d"/>
      <text x="419" y="30" fill="#d6f269" font-family="sans-serif" font-weight="700" font-size="22" text-anchor="middle">−</text>
    </g>

    <!-- Row 4: 1, 2, 3, + -->
    <g transform="translate(24, 424)">
      <rect x="0" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="0" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="53" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">1</text>

      <rect x="122" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="122" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="175" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">2</text>

      <rect x="244" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="244" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="297" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">3</text>

      <rect x="366" y="0" width="106" height="52" rx="12" fill="#2a3540" stroke="#3d4d5e" stroke-width="1"/>
      <rect x="366" y="0" width="106" height="47" rx="12" fill="#323f4d"/>
      <text x="419" y="30" fill="#d6f269" font-family="sans-serif" font-weight="700" font-size="22" text-anchor="middle">+</text>
    </g>

    <!-- Row 5: 0, ., ⌫, = -->
    <g transform="translate(24, 492)">
      <rect x="0" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="0" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="53" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="600" font-size="20" text-anchor="middle">0</text>

      <rect x="122" y="0" width="106" height="52" rx="12" fill="#141a20" stroke="#222b34" stroke-width="1"/>
      <rect x="122" y="0" width="106" height="47" rx="12" fill="#1b222a"/>
      <text x="175" y="30" fill="#f0f4f8" font-family="sans-serif" font-weight="700" font-size="20" text-anchor="middle">.</text>

      <rect x="244" y="0" width="106" height="52" rx="12" fill="#1f2832" stroke="#2f3d4c" stroke-width="1"/>
      <rect x="244" y="0" width="106" height="47" rx="12" fill="#26313d"/>
      <text x="297" y="30" fill="#f87171" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">⌫</text>

      <!-- Equals Key (Reachmark Lime) -->
      <rect x="366" y="0" width="106" height="52" rx="12" fill="#a4be35" stroke="#7e9424" stroke-width="1"/>
      <rect x="366" y="0" width="106" height="47" rx="12" fill="url(#limeGrad)"/>
      <text x="419" y="31" fill="#0b0f14" font-family="sans-serif" font-weight="900" font-size="24" text-anchor="middle">=</text>
    </g>

    <!-- Bottom Memory Bar -->
    <g transform="translate(24, 568)">
      <rect width="472" height="44" rx="10" fill="#131a20" stroke="#1d262e" stroke-width="1"/>
      <text x="48" y="27" fill="#8da0b2" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">MC</text>
      <text x="142" y="27" fill="#8da0b2" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">MR</text>
      <text x="236" y="27" fill="#8da0b2" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">M+</text>
      <text x="330" y="27" fill="#8da0b2" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">M−</text>
      <text x="424" y="27" fill="#8da0b2" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">MS</text>
    </g>
  </g>

  <!-- Right Side: Global Currency Exchanger Card -->
  <g transform="translate(710, 40)" filter="url(#shadow3d)">
    <rect width="440" height="640" rx="28" fill="#0e1317" stroke="#1c242c" stroke-width="2"/>

    <!-- Header -->
    <rect x="0" y="0" width="440" height="64" rx="28" fill="#131a20"/>
    <rect x="0" y="32" width="440" height="32" fill="#131a20"/>
    <line x1="0" y1="64" x2="440" y2="64" stroke="#1c242c" stroke-width="1.5"/>

    <text x="24" y="38" fill="#f0f4f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16">Global Currency Exchanger</text>
    <rect x="330" y="20" width="86" height="24" rx="6" fill="#18271a" stroke="#254228" stroke-width="1"/>
    <text x="373" y="36" fill="#4ade80" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">120+ GLOBAL</text>

    <!-- Currency Converter Box -->
    <g transform="translate(24, 88)">
      <!-- From input -->
      <rect width="392" height="76" rx="14" fill="#080a0c" stroke="#1b242d" stroke-width="1.5"/>
      <text x="16" y="30" fill="#687989" font-family="sans-serif" font-size="12" font-weight="600">FROM</text>
      <text x="16" y="58" fill="#f0f4f8" font-family="monospace" font-size="22" font-weight="700">1,000.00</text>
      <rect x="290" y="20" width="88" height="36" rx="8" fill="#171f27" stroke="#2c3a47" stroke-width="1"/>
      <text x="334" y="43" fill="#d6f269" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle">🇺🇸 USD</text>

      <!-- Swap Button -->
      <g transform="translate(176, 90)">
        <circle cx="20" cy="20" r="18" fill="#1b232c" stroke="#2f3d4d" stroke-width="1.5"/>
        <text x="20" y="26" fill="#d6f269" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">⇄</text>
      </g>

      <!-- To input -->
      <g transform="translate(0, 126)">
        <rect width="392" height="76" rx="14" fill="#080a0c" stroke="#1b242d" stroke-width="1.5"/>
        <text x="16" y="30" fill="#687989" font-family="sans-serif" font-size="12" font-weight="600">TO</text>
        <text x="16" y="58" fill="#d6f269" font-family="monospace" font-size="22" font-weight="700">1,620,000.00</text>
        <rect x="290" y="20" width="88" height="36" rx="8" fill="#171f27" stroke="#2c3a47" stroke-width="1"/>
        <text x="334" y="43" fill="#d6f269" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle">🇳🇬 NGN</text>
      </g>

      <!-- Rate badge -->
      <g transform="translate(0, 222)">
        <rect width="392" height="40" rx="10" fill="#12181f" stroke="#1b2530" stroke-width="1"/>
        <text x="16" y="25" fill="#8da0b2" font-family="sans-serif" font-size="12">Exchange Rate:</text>
        <text x="376" y="25" fill="#f0f4f8" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">1 USD = 1,620.00 NGN</text>
      </g>

      <!-- Insert to Calc Button -->
      <g transform="translate(0, 276)">
        <rect width="392" height="48" rx="12" fill="url(#limeGrad)"/>
        <text x="196" y="29" fill="#0b0f14" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle">Insert Result to Calculator</text>
      </g>
    </g>

    <!-- Calculation History Section -->
    <g transform="translate(24, 444)">
      <text x="0" y="14" fill="#8da0b2" font-family="sans-serif" font-weight="700" font-size="12" letter-spacing="1">RECENT CALCULATIONS</text>
      <line x1="0" y1="26" x2="392" y2="26" stroke="#1a222a" stroke-width="1"/>

      <g transform="translate(0, 38)">
        <rect width="392" height="44" rx="8" fill="#090d10"/>
        <text x="12" y="26" fill="#8da0b2" font-family="monospace" font-size="12">15,000 × 7.5%</text>
        <text x="380" y="26" fill="#d6f269" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">= 1,125</text>
      </g>

      <g transform="translate(0, 92)">
        <rect width="392" height="44" rx="8" fill="#090d10"/>
        <text x="12" y="26" fill="#8da0b2" font-family="monospace" font-size="12">√(144) + 5²</text>
        <text x="380" y="26" fill="#d6f269" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">= 37</text>
      </g>

      <g transform="translate(0, 146)">
        <rect width="392" height="44" rx="8" fill="#090d10"/>
        <text x="12" y="26" fill="#8da0b2" font-family="monospace" font-size="12">5,200 ÷ 4 + 180</text>
        <text x="380" y="26" fill="#d6f269" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">= 1,480</text>
      </g>
    </g>
  </g>
</svg>
